server {
    # Use this line when NPM is at the edge. If Cloudflare is in front, change it to `CF-Connecting-IP`,
    # and ensure `set_real_ip_from` includes only Cloudflare's IP ranges.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    satisfy all;
    auth_request /_ra/verify;

    location = /_ra/verify {
        internal;
        auth_request off;
        satisfy all;

        # This is your `restricted-access` service address. `/verify` must be exists.
        proxy_pass http://127.0.0.1:8088/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie $http_cookie;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        access_log off;
    }

    location = /_ra/gate {
        auth_request off;
        satisfy all;
        limit_except GET { deny all; }

        # This is your `restricted-access` service address. `/enter` must be exists.
        proxy_pass http://127.0.0.1:8088/enter;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie $http_cookie;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /_ra/callback {
        auth_request off;
        satisfy all;
        limit_except GET { deny all; }
        access_log off;

        # This is your `restricted-access` service address. `/exchange` must be exists.
        proxy_pass http://127.0.0.1:8088/exchange;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization "";
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location @ra_enter {
        auth_request off;
        satisfy all;
        return 302 /_ra/gate;
    }

    location ^~ /_ra/ {
        auth_request off;
        satisfy all;
        return 404;
    }

    location = /_ra {
        auth_request off;
        satisfy all;
        return 404;
    }

    location / {
        satisfy all;
        auth_request /_ra/verify;
        error_page 401 = @ra_enter;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        # This is your service address. (This isn't `restricted-access` service.)
        proxy_pass http://127.0.0.1:8080$request_uri;
    }

    # Examples of bypassing the verification section
    location ^~ /v1/ {
        auth_request off;
        satisfy all;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8080$request_uri;
    }
}